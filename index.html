<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f2e9">
    <meta name="description" content="Огромная кнопка, огромные деньги">
    <title>Bang Button — Огромная кнопка, огромные деньги</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="./" aria-label="Bang Button — главная">
        <span class="brand-mark" aria-hidden="true">✳</span> BANG BUTTON
      </a>
      <span class="edition" aria-hidden="true">№ 001</span>
    </header>

    <main>
      <h1>Огромная кнопка, <span>огромные деньги</span></h1>
      <div class="product">
        <div class="button-base">
          <button class="bang" type="button" aria-label="Описание Bang Button. Переключить на казахский язык">
            <span class="button-content">
              <span class="button-language" aria-hidden="true">RU / 01</span>
              <span class="button-title">BANG!</span>
              <span class="button-description" aria-live="polite" aria-atomic="true">Выбери файл и задание в LMS. Идея Bang Button — отправить домашку одним нажатием.</span>
              <span class="button-hint">Нажми → Қазақша</span>
            </span>
          </button>
        </div>
        <div class="ripple" aria-hidden="true"></div>
      </div>
    </main>

    <footer aria-hidden="true"><span>BANG BUTTON</span><span>↗</span></footer>
  </body>
</html>
